<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111214"><title>CareerBase</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}body{padding-bottom:94px}.app{max-width:430px;margin:auto;min-height:100vh;background:#111214;overflow:hidden}.page{display:none;min-height:calc(100vh - 86px)}.page.active{display:block}.muted{color:#96979d}.mono{font-variant-numeric:tabular-nums}.hero{height:560px;position:relative;background:linear-gradient(#151618 0%,#151618 55%,#111214 100%);overflow:hidden}.grab{position:absolute;top:17px;left:50%;width:47px;height:5px;border-radius:9px;background:#777;transform:translateX(-50%)}.silhouette{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);width:285px;height:360px}.head{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:155px;height:185px;border-radius:48% 48% 44% 44%;background:linear-gradient(145deg,#777,#343538 65%,#202124)}.neck{position:absolute;left:50%;top:185px;transform:translateX(-50%);width:84px;height:95px;background:#3b3c3f}.bodyShape{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:350px;height:190px;border-radius:48% 48% 0 0;background:linear-gradient(120deg,#55575b,#242528)}.heroInfo{position:absolute;bottom:38px;left:0;right:0;text-align:center}.first{font-size:18px}.last{font-size:43px;font-weight:900;letter-spacing:-1.5px;margin:4px 0 12px;text-transform:uppercase}.chips{display:flex;gap:7px;justify-content:center}.chip{background:#2a2b2e;padding:7px 12px;border-radius:7px;font-weight:700}.clubrow{height:104px;padding:20px 34px;display:flex;align-items:center;border-bottom:1px solid #1c1d1f}.crest{width:45px;height:45px;border-radius:50%;border:3px solid #fff;background:#d71920;display:grid;place-items:center;font-weight:900;font-size:11px;color:white;box-shadow:0 0 0 2px #2261b3 inset}.sectionTitle{font-weight:900;font-size:22px;padding:24px 34px 16px;text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr;gap:12px;padding:0 18px}.card{background:#121315;border:1px solid #1c1d20;border-radius:10px;padding:18px}.summary{min-height:180px}.summary .big{font-size:28px;margin-top:54px}.statrow{display:flex;justify-content:space-between;margin-top:12px}.statrow>div:last-child{text-align:right}.smallcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 18px}.smallcard{text-align:center;padding:17px 7px}.smallcard .v{font-size:25px}.fixtures{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;padding:16px 7px}.fixture .md{font-size:14px;font-weight:700}.fixture .teams{height:40px;display:flex;align-items:center;justify-content:center;gap:7px}.miniCrest{width:26px;height:26px;border-radius:50%;background:#282a2e;border:1px solid #777;display:grid;place-items:center;font-size:8px;font-weight:900}.fitness{display:flex;align-items:center;justify-content:space-between}.statusIcon{font-size:28px}.cardsCount{display:flex;gap:18px;text-align:center}.yc,.rc{display:inline-block;width:15px;height:23px}.yc{background:#ffd400}.rc{background:#ff430f}.editFab{position:fixed;right:max(18px,calc((100vw - 430px)/2 + 18px));bottom:102px;width:48px;height:48px;border:0;border-radius:50%;background:#f2f2f4;color:#111;font-size:23px;z-index:20;box-shadow:0 4px 20px #0008}.seasonbar{padding:28px 34px 8px;font-weight:800}.performance{padding:0 0 22px}.scrollGames{display:flex;overflow-x:auto;scroll-snap-type:x proximity;gap:20px;padding:22px 34px 8px;scrollbar-width:none}.scrollGames::-webkit-scrollbar{display:none}.gamecol{width:116px;flex:0 0 116px;text-align:center;scroll-snap-align:start}.gamecol .num{font-size:20px;height:30px}.opps{height:50px;display:flex;justify-content:center;align-items:center;gap:6px}.score{height:29px;font-size:16px}.barTrack{height:305px;width:52px;background:#18191b;border-radius:4px;margin:0 auto;display:flex;align-items:flex-end;overflow:hidden}.bar{width:100%;min-height:0;border-radius:4px 4px 3px 3px;position:relative;display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0;gap:3px}.bar.neg{background:#d43b35}.bar.orange{background:#f38b21}.bar.light{background:#98df3d}.bar.dark{background:#25d78d}.bar.gold{background:#e9c331}.event{font-size:18px;line-height:18px}.pts{font-size:22px;font-weight:900;margin-top:9px}.pts.neg{color:#e14a43}.pts.orange{color:#f38b21}.pts.light{color:#98df3d}.pts.dark{color:#25d78d}.pts.gold{color:#e9c331}.mins{font-size:18px;color:#a4a5aa;margin-top:5px}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 18px}.total{text-align:center;padding:17px 5px}.total .v{font-size:24px}.bottom{position:fixed;z-index:15;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:88px;background:#111214;border-top:1px solid #1d1e20;display:grid;grid-template-columns:repeat(2,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav{border:0;background:none;color:#696a70;font-size:12px}.nav .ico{font-size:28px;display:block;margin-bottom:5px}.nav.active{color:#f3f3f5}.nav.active .label{font-weight:800}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:40;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:#17181b;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:5px 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field.full{grid-column:1/-1}label{display:block;font-size:12px;color:#aaa;margin:0 0 5px 2px}input,select{width:100%;background:#242529;border:1px solid #36373c;color:#fff;border-radius:9px;padding:12px;font-size:16px}button.primary,button.secondary,button.danger{width:100%;border:0;border-radius:10px;padding:13px;font-weight:800;font-size:15px;margin-top:8px}.primary{background:#f2f2f4;color:#111}.secondary{background:#2a2b2e;color:#fff}.danger{background:#4a1e1e;color:#ffb0aa}.sheetTop{display:flex;justify-content:space-between;align-items:center}.close{background:none;border:0;color:#aaa;font-size:27px}.seasonSelect{display:flex;gap:8px;padding:0 18px 14px}.seasonSelect select{flex:1}.seasonSelect button{width:46px;border:0;border-radius:9px;font-size:22px}.hint{font-size:12px;color:#8f9095;line-height:1.4}.empty{color:#777}.divider{height:1px;background:#2a2b2e;margin:14px 0}
</style></head><body><main class="app">
<section id="overview" class="page active"><div class="hero"><div class="grab"></div><div class="silhouette"><div class="head"></div><div class="neck"></div><div class="bodyShape"></div></div><div class="heroInfo"><div id="firstName" class="first"></div><div id="lastName" class="last"></div><div class="chips"><span id="posChip" class="chip"></span><span id="numChip" class="chip"></span><span id="chanceChip" class="chip"></span></div></div></div><div class="clubrow"><div class="crest">FCB</div></div><div class="sectionTitle" id="overviewLast"></div><div class="grid2"><div class="card summary"><div id="colorTicks">—</div><div class="statrow"><div><div id="sumPts" class="big mono">0</div><div class="muted">Punkte</div></div><div><div id="sumGoals" class="big mono">×0</div><div class="muted">Tore</div></div></div><div class="statrow"><div><div id="avgPts" class="mono">0</div><div class="muted">Ø Punkte</div></div><div><div id="sumAssists" class="mono">×0</div><div class="muted">Vorlagen</div></div></div></div></div><div class="smallcards"><div class="card smallcard"><div id="apps" class="v mono">0/34</div><div class="muted">Einsätze</div></div><div class="card smallcard"><div id="starts" class="v mono">0×</div><div class="muted">S11</div></div><div class="card smallcard"><div id="avgMinManual" class="v mono">0′</div><div class="muted">Ø Minuten</div></div></div><div class="card" style="margin:12px 18px"><div id="fixtureStrip" class="fixtures"></div></div><div class="card fitness" style="margin:12px 18px 24px"><div><div id="fitIcon" class="statusIcon"></div><div id="fitnessText" style="font-size:22px;margin-top:8px"></div></div><div class="cardsCount"><div><span class="yc"></span><div id="yellowCount" class="muted">×0</div></div><div><span class="rc"></span><div id="redCount" class="muted">×0</div></div></div></div></section>
<section id="performance" class="page"><div class="grab" style="position:relative;top:17px;margin:auto;left:auto;transform:none"></div><div class="sectionTitle" id="perfLast" style="padding-top:62px"></div><div class="seasonbar">SAISON</div><div class="seasonSelect"><select id="seasonPicker"></select><button id="addSeasonBtn">＋</button></div><div class="performance"><div id="games" class="scrollGames"></div><div class="totals"><div class="card total"><div id="perfAvg" class="v mono">0</div><div class="muted">Ø Punkte</div></div><div class="card total"><div id="perfTotal" class="v mono">0</div><div class="muted">Gesamtpunkte</div></div><div class="card total"><div id="perfMins" class="v mono">0</div><div class="muted">Ø Minuten</div></div></div></div></section>
</main><button class="editFab" id="editFab">✎</button><nav class="bottom"><button class="nav active" data-page="overview"><span class="ico">▦</span><span class="label">ÜBERSICHT</span></button><button class="nav" data-page="performance"><span class="ico">▥</span><span class="label">LEISTUNG</span></button></nav>
<div id="modal" class="modal"><div class="sheet"><div class="sheetTop"><h2 id="modalTitle">Bearbeiten</h2><button class="close" id="closeModal">×</button></div><div id="profileForm"><div class="formgrid"><div class="field full"><label>Name</label><input id="fName" maxlength="40"></div><div class="field"><label>Position</label><select id="fPos"><option>TW</option><option>ABW</option><option>MF</option><option>ANG</option></select></div><div class="field"><label>Nummer</label><input id="fNum" type="number" min="1" max="99"></div><div class="field full"><label>Startelfwahrscheinlichkeit</label><select id="fChance"><option value="safe">🔵 Sicher</option><option value="likely">🟢 Wahrscheinlich</option><option value="uncertain">🟠 Unsicher</option><option value="unlikely">🔴 Unwahrscheinlich</option><option value="impossible">⚫ Unmöglich</option></select></div><div class="field"><label>Einsätze (0–34)</label><input id="fApps" type="number" min="0" max="34"></div><div class="field"><label>S11 (0–34)</label><input id="fStarts" type="number" min="0" max="34"></div><div class="field"><label>Ø Minuten (0–100)</label><input id="fAvgMin" type="number" min="0" max="100"></div><div class="field"><label>Fitness</label><select id="fFitness"><option>Fit</option><option>Angeschlagen</option><option>Verletzt</option></select></div><div class="field"><label>Gelbe Karten</label><input id="fYellow" type="number" min="0" max="34"></div><div class="field"><label>Rote Karten</label><input id="fRed" type="number" min="0" max="34"></div></div><button class="primary" id="saveProfile">Speichern</button><div class="divider"></div><button class="secondary" id="exportBtn">Backup exportieren</button><button class="secondary" id="importBtn">Backup importieren</button><input id="importFile" type="file" accept="application/json" hidden></div><div id="gameForm" style="display:none"><div class="formgrid"><div class="field full"><label>Spieltag</label><input id="gMd" disabled></div><div class="field full"><label>Status</label><select id="gPlayed"><option value="false">Noch nicht gespielt</option><option value="true">Gespielt</option></select></div><div class="field full"><label>Gegner</label><select id="gOpp"></select></div><div class="field"><label>Heim/Auswärts</label><select id="gHome"><option value="home">Heim</option><option value="away">Auswärts</option></select></div><div class="field"><label>Datum (optional)</label><input id="gDate" placeholder="z.B. 20. SEP."></div><div class="field"><label>Eigene Tore</label><input id="gFor" type="number" min="0" max="30"></div><div class="field"><label>Gegentore</label><input id="gAgainst" type="number" min="0" max="30"></div><div class="field"><label>Punkte</label><input id="gPts" type="number" min="-999" max="9999"></div><div class="field"><label>Minuten</label><input id="gMins" type="number" min="0" max="120"></div><div class="field"><label>Eigene Tore</label><input id="gGoals" type="number" min="0" max="20"></div><div class="field"><label>Vorlagen</label><input id="gAssists" type="number" min="0" max="20"></div></div><button class="primary" id="saveGame">Spieltag speichern</button><button class="danger" id="clearGame">Spieltag leeren</button></div><div id="seasonForm" style="display:none"><div class="field"><label>Saisonname</label><input id="sName" placeholder="z.B. 2026/2027"></div><p class="hint">Neue Saison = 34 leere Spieltage. Gegner kannst du pro Spieltag aus Bundesliga + 2. Bundesliga 2025/26 auswählen.</p><button class="primary" id="createSeason">Saison erstellen</button></div></div></div>
<script>
const KEY='careerbase_fc26_v1';
const clubs=[
['RBL','RB Leipzig'],['FCA','FC Augsburg'],['HSV','Hamburger SV'],['TSG','TSG Hoffenheim'],['SVW','Werder Bremen'],['SGE','Eintracht Frankfurt'],['BVB','Borussia Dortmund'],['BMG','Borussia Mönchengladbach'],['B04','Bayer 04 Leverkusen'],['FCU','Union Berlin'],['SCF','SC Freiburg'],['STP','FC St. Pauli'],['VFB','VfB Stuttgart'],['M05','Mainz 05'],['FCH','1. FC Heidenheim'],['WOB','VfL Wolfsburg'],['KOE','1. FC Köln'],
['S04','FC Schalke 04'],['SVE','SV Elversberg'],['H96','Hannover 96'],['SCP','SC Paderborn 07'],['SVD','SV Darmstadt 98'],['BSC','Hertha BSC'],['FCK','1. FC Kaiserslautern'],['FCN','1. FC Nürnberg'],['KSC','Karlsruher SC'],['BOC','VfL Bochum'],['KSV','Holstein Kiel'],['FCM','1. FC Magdeburg'],['SGD','Dynamo Dresden'],['EBS','Eintracht Braunschweig'],['F95','Fortuna Düsseldorf'],['DSC','Arminia Bielefeld'],['SGF','Greuther Fürth'],['SCPM','Preußen Münster']];
const chanceMap={safe:['✦','Sicher'],likely:['✓','Wahrscheinlich'],uncertain:['?','Unsicher'],unlikely:['!','Unwahrscheinlich'],impossible:['×','Unmöglich']};
const defaultGames=Array.from({length:34},(_,i)=>({md:i+1,played:false,opp:'',home:'home',date:'',gf:0,ga:0,points:0,mins:0,goals:0,assists:0}));
const clone=o=>JSON.parse(JSON.stringify(o));
const defaults={profile:{name:'DEIN NAME',pos:'MF',num:10,chance:'safe',apps:0,starts:0,avgMin:0,fitness:'Fit',yellow:0,red:0},seasonId:'s1',seasons:[{id:'s1',name:'2025/2026',games:clone(defaultGames)}]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||clone(defaults)}catch(e){data=clone(defaults)}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function clamp(v,a,b){return Math.max(a,Math.min(b,Number(v)||0))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function season(){return data.seasons.find(s=>s.id===data.seasonId)||data.seasons[0]}function club(code){return clubs.find(c=>c[0]===code)||[code,code||'—']}
function pointClass(p){p=Number(p);if(p<0)return'neg';if(p<=99)return'orange';if(p<=199)return'light';if(p<=399)return'dark';return'gold'}
function crest(code){if(!code)return'<span class="miniCrest">—</span>';return `<span class="miniCrest">${esc(code)}</span>`}
function splitName(n){let a=String(n||'DEIN NAME').trim().split(/\s+/);return [a.slice(0,-1).join(' ')||'',a.at(-1)||'SPIELER']}
function render(){const p=data.profile,s=season(),g=s.games;const [first,last]=splitName(p.name);firstName.textContent=first;lastName.textContent=last;overviewLast.textContent=last;perfLast.textContent=last;posChip.textContent=p.pos;numChip.textContent=p.num;chanceChip.textContent=chanceMap[p.chance]?.[0]||'✦';const played=g.filter(x=>x.played);const total=played.reduce((a,x)=>a+(Number(x.points)||0),0), goals=played.reduce((a,x)=>a+(Number(x.goals)||0),0), assists=played.reduce((a,x)=>a+(Number(x.assists)||0),0), mins=played.reduce((a,x)=>a+(Number(x.mins)||0),0);sumPts.textContent=total.toLocaleString('de-DE');sumGoals.textContent='×'+goals;sumAssists.textContent='×'+assists;avgPts.textContent=played.length?Math.round(total/played.length):0;colorTicks.innerHTML=played.slice(-5).map(x=>`<span style="color:${({neg:'#d43b35',orange:'#f38b21',light:'#98df3d',dark:'#25d78d',gold:'#e9c331'})[pointClass(x.points)]}">━</span>`).join(' ')||'—';apps.textContent=`${p.apps}/34`;starts.textContent=p.starts+'×';avgMinManual.textContent=p.avgMin+'′';fitnessText.textContent=p.fitness;fitIcon.textContent=p.fitness==='Fit'?'✓':p.fitness==='Angeschlagen'?'!':'✚';yellowCount.textContent='×'+p.yellow;redCount.textContent='×'+p.red;renderFixtures(g);renderGames(g);perfTotal.textContent=total.toLocaleString('de-DE');perfAvg.textContent=played.length?Math.round(total/played.length):0;perfMins.textContent=played.length?Math.round(mins/played.length):0;seasonPicker.innerHTML=data.seasons.map(x=>`<option value="${x.id}" ${x.id===data.seasonId?'selected':''}>${esc(x.name)}</option>`).join('')}
function renderFixtures(g){const played=g.filter(x=>x.played),last=played.at(-1);let start=last?last.md:0;let arr=[];if(last)arr.push(last);arr.push(...g.filter(x=>!x.played&&x.md>start).slice(0,last?2:3));fixtureStrip.innerHTML=arr.length?arr.map(x=>{let c=club(x.opp),teams=x.home==='home'?[['FCB','FC Bayern'],c]:[c,['FCB','FC Bayern']];return `<div class="fixture"><div class="md">Spieltag ${x.md}</div><div class="teams">${crest(teams[0][0])}${crest(teams[1][0])}</div><div>${x.played?`${x.gf} : ${x.ga}`:(esc(x.date)||'—')}</div></div>`}).join(''):'<div class="muted">Noch keine Partien</div>'}
function renderGames(g){games.innerHTML=g.map(x=>{let c=club(x.opp),teams=x.home==='home'?[['FCB','FC Bayern'],c]:[c,['FCB','FC Bayern']],pc=pointClass(x.points),h=x.played?Math.max(16,Math.min(100,18+Math.sqrt(Math.abs(x.points))*4.1)):0;let events='';if(x.played){events+='⚽'.repeat(clamp(x.goals,0,20));events+='👟'.repeat(clamp(x.assists,0,20))}return `<div class="gamecol" data-md="${x.md}"><div class="num">${x.md===1?'#1':x.md}</div><div class="opps">${x.opp?crest(teams[0][0])+crest(teams[1][0]):'<span class="empty">—</span>'}</div><div class="score">${x.played?`${x.gf} : ${x.ga}`:(esc(x.date)||'—')}</div><div class="barTrack"><div class="bar ${pc}" style="height:${h}%">${[...events].map(e=>`<span class="event">${e}</span>`).join('')}</div></div><div class="pts ${x.played?pc:''}">${x.played?x.points:'-'}</div><div class="mins">${x.played?x.mins+'′':'-'}</div></div>`}).join('');document.querySelectorAll('.gamecol').forEach(el=>el.onclick=()=>openGame(Number(el.dataset.md)))}
function openProfile(){modalTitle.textContent='Profil & Saisonwerte';profileForm.style.display='block';gameForm.style.display='none';seasonForm.style.display='none';const p=data.profile;fName.value=p.name;fPos.value=p.pos;fNum.value=p.num;fChance.value=p.chance;fApps.value=p.apps;fStarts.value=p.starts;fAvgMin.value=p.avgMin;fFitness.value=p.fitness;fYellow.value=p.yellow;fRed.value=p.red;modal.classList.add('open')}
function openGame(md){const x=season().games[md-1];modalTitle.textContent='Spieltag '+md;profileForm.style.display='none';gameForm.style.display='block';seasonForm.style.display='none';gMd.value=md;gPlayed.value=String(x.played);gOpp.innerHTML='<option value="">Gegner wählen…</option>'+clubs.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join('');gOpp.value=x.opp;gHome.value=x.home;gDate.value=x.date;gFor.value=x.gf;gAgainst.value=x.ga;gPts.value=x.points;gMins.value=x.mins;gGoals.value=x.goals;gAssists.value=x.assists;modal.classList.add('open')}
function openSeason(){modalTitle.textContent='Neue Saison';profileForm.style.display='none';gameForm.style.display='none';seasonForm.style.display='block';sName.value='';modal.classList.add('open')}
editFab.onclick=()=>document.querySelector('#overview').classList.contains('active')?openProfile():openSeason();closeModal.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
saveProfile.onclick=()=>{data.profile={name:fName.value.trim()||'DEIN NAME',pos:fPos.value,num:clamp(fNum.value,1,99),chance:fChance.value,apps:clamp(fApps.value,0,34),starts:clamp(fStarts.value,0,34),avgMin:clamp(fAvgMin.value,0,100),fitness:fFitness.value,yellow:clamp(fYellow.value,0,34),red:clamp(fRed.value,0,34)};save();modal.classList.remove('open')};
saveGame.onclick=()=>{let md=Number(gMd.value),x=season().games[md-1];Object.assign(x,{played:gPlayed.value==='true',opp:gOpp.value,home:gHome.value,date:gDate.value.trim(),gf:clamp(gFor.value,0,30),ga:clamp(gAgainst.value,0,30),points:Math.max(-999,Math.min(9999,Number(gPts.value)||0)),mins:clamp(gMins.value,0,120),goals:clamp(gGoals.value,0,20),assists:clamp(gAssists.value,0,20)});save();modal.classList.remove('open')};
clearGame.onclick=()=>{let md=Number(gMd.value);season().games[md-1]={...clone(defaultGames[md-1])};save();modal.classList.remove('open')};
createSeason.onclick=()=>{let name=sName.value.trim();if(!name)return;let id='s'+Date.now();data.seasons.push({id,name,games:clone(defaultGames)});data.seasonId=id;save();modal.classList.remove('open')};seasonPicker.onchange=()=>{data.seasonId=seasonPicker.value;save()};addSeasonBtn.onclick=openSeason;
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');b.classList.add('active');editFab.textContent=b.dataset.page==='overview'?'✎':'＋';window.scrollTo(0,0)});
exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='careerbase-backup.json';a.click();URL.revokeObjectURL(a.href)};importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{try{let d=JSON.parse(await importFile.files[0].text());if(!d.profile||!Array.isArray(d.seasons))throw 0;data=d;save();modal.classList.remove('open')}catch(e){alert('Backup konnte nicht gelesen werden.')}};render();
</script></body></html>
